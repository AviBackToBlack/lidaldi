name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs — a push-to-main run should always
  # finish so required checks get a real result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Third-party Docker actions are full-SHA pinned and explicitly allowlisted.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Build the same image docker compose uses locally (pyenv Python 3.12.13
      # + Playwright browsers + k6) so local == CI. Layers are cached in the
      # GitHub Actions cache; the Python build only reruns when the Dockerfile
      # or install-k6.sh change.
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: lidaldi-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --ipc=host: Chromium needs more than Docker's default 64 MB /dev/shm.
      - name: make test
        run: docker run --rm --ipc=host -v "$PWD:/work" -w /work -e CI=true lidaldi-test:ci make test
