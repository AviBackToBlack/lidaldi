# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sets up Snyk to run Snyk Code (SAST) and Snyk Open Source (SCA) against
# this repo. Container/IaC scanning are omitted: this repo has no root
# Dockerfile (it deploys to a VPS via deploy/update.sh, not a container).
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. A push-to-main run must always finish
  # (snyk monitor + the Code Scanning SARIF upload), so don't cancel those.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Needs to be visible to every step that shells out to `snyk`, not just
      # the CLI setup step (which doesn't actually use it).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # A personal access token (unlike a legacy per-account API key) isn't
      # tied to a single default org, so the CLI can't infer which org to
      # act against without this — omitting it 403s with an empty org name.
      # Note: the CLI still calls GET /rest/orgs/{id} regardless of whether
      # this is the org ID or its slug (tried both — same 403 either way),
      # to resolve/validate the org. That call 403s because the PAT wasn't
      # granted a scope covering it; it's cosmetic — the actual scan/monitor
      # both succeed regardless. Fix at the source by granting that scope
      # (or regenerating the PAT with it) at
      # https://app.snyk.io/account/personal-access-tokens.
      SNYK_CFG_ORG: "08ee9b45-66fd-4689-b808-50fc0e58ce15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # Snyk Open Source resolves each project's dependency tree from an
        # actual installed environment, not just the manifest — so both the
        # Python (root + tests/) and Node (frontend/) dependencies need to
        # be installed first, or `snyk monitor` reports "Missing required
        # packages" for whichever ecosystem wasn't set up.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r tests/requirements.txt

      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # Use || true to not fail the pipeline
        #
        # --sarif-file-output (not `--sarif > file`): the latter redirects
        # ALL output into the SARIF file, so a failed run's log shows only
        # "Process completed with exit code 1" and nothing about why —
        # --sarif-file-output writes the SARIF to disk while still printing
        # the normal human-readable findings list to the job log.
      - name: Snyk Code test
        # Findings don't fail the build — they're uploaded to GitHub Code
        # Scanning below for visibility. Most findings are false positives
        # in test/sample/legacy files; the two real LOW findings (theme.ts
        # cookie Secure attribute, sw.ts postMessage origin check) are fixed.
        run: snyk code test --sarif-file-output=snyk-code.sarif || true

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
        # Independent of Snyk Code above — a Code finding failing that step
        # shouldn't stop dependency monitoring from running and reporting.
        # success() || failure(), not always(): always() also fires on job
        # cancellation, and cancel-in-progress above cancels superseded PR
        # runs — we don't want a cancelled run still pushing a `snyk
        # monitor` snapshot (a persistent record, unlike `snyk test`).
      - name: Snyk Open Source monitor
        if: success() || failure()
        run: snyk monitor --all-projects

        # `snyk code test` above still fails the job on real findings (the
        # `|| true` fallback is deliberately commented out) — but a hard
        # error (auth, org config) can leave snyk-code.sarif empty/invalid,
        # which upload-sarif can't parse. Only attempt the upload when the
        # file actually contains parseable SARIF.
      - name: Check SARIF output is valid
        id: sarif-check
        if: success() || failure()
        run: |
          if [ -s snyk-code.sarif ] && jq empty snyk-code.sarif >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

        # Push the Snyk Code results into GitHub Code Scanning tab.
      - name: Upload result to GitHub Code Scanning
        if: (success() || failure()) && steps.sarif-check.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk-code.sarif
