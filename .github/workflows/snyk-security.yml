# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sets up Snyk to run Snyk Code (SAST) and Snyk Open Source (SCA) against
# this repo. Container/IaC scanning are omitted: this repo has no root
# Dockerfile (it deploys to a VPS via deploy/update.sh, not a container).
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. A push-to-main run must always finish
  # (snyk monitor + the Code Scanning SARIF upload), so don't cancel those.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Needs to be visible to every step that shells out to `snyk`, not just
      # the CLI setup step (which doesn't actually use it).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # A personal access token (unlike a legacy per-account API key) isn't
      # tied to a single default org, so the CLI can't infer which org to
      # act against without this — omitting it 403s with an empty org name.
      SNYK_CFG_ORG: "08ee9b45-66fd-4689-b808-50fc0e58ce15"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        # Snyk Open Source resolves frontend/'s dependency tree via its
        # node_modules, so it needs to be installed first.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # Use || true to not fail the pipeline
      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif # || true

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects

        # `snyk code test` above still fails the job on real findings (the
        # `|| true` fallback is deliberately commented out) — but a hard
        # error (auth, org config) can leave snyk-code.sarif empty/invalid,
        # which upload-sarif can't parse. Only attempt the upload when the
        # file actually contains parseable SARIF.
      - name: Check SARIF output is valid
        id: sarif-check
        if: always()
        run: |
          if [ -s snyk-code.sarif ] && jq empty snyk-code.sarif >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

        # Push the Snyk Code results into GitHub Code Scanning tab.
      - name: Upload result to GitHub Code Scanning
        if: always() && steps.sarif-check.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk-code.sarif
