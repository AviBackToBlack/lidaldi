version: 2

updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "devcontainers"]
    commit-message:
      prefix: "deps"
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      time: "06:02"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:04"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests/e2e
    schedule:
      interval: monthly
      time: "06:06"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "deps"
    groups:
      # These versions are intentionally kept compatible. A previous isolated
      # Vite bump broke the Svelte/Vitest toolchain, so keep them atomic.
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte"
          - "vitest"
      routine:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte"
          - "vitest"
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directories:
      - /
      - /tests
    schedule:
      interval: monthly
      time: "06:08"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
